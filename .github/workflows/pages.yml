name: Validate and deploy STT Compare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check backend
      - run: python -m pytest -q
        working-directory: backend
      - run: docker build --tag stt-compare-api:check backend
      - name: Verify native Azure SDK in deployment image
        run: |
          docker run --rm stt-compare-api:check python -c \
            "import azure.cognitiveservices.speech as sdk; config = sdk.SpeechConfig(subscription='test-key', region='eastus'); stream = sdk.audio.PushAudioInputStream(stream_format=sdk.audio.AudioStreamFormat(samples_per_second=16000, bits_per_sample=16, channels=1)); recognizer = sdk.SpeechRecognizer(speech_config=config, audio_config=sdk.audio.AudioConfig(stream=stream)); auto_config = sdk.SpeechConfig(subscription='test-key', endpoint='wss://eastus.stt.speech.microsoft.com/speech/universal/v2'); auto_config.set_property(sdk.PropertyId.SpeechServiceConnection_LanguageIdMode, 'Continuous'); candidates = sdk.languageconfig.AutoDetectSourceLanguageConfig(languages=['en-US', 'hi-IN']); auto_recognizer = sdk.SpeechRecognizer(speech_config=auto_config, audio_config=sdk.audio.AudioConfig(stream=stream), auto_detect_source_language_config=candidates); stream.close(); print('Fixed-language and auto-detect native SDK initialized without a provider request')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE }}
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
